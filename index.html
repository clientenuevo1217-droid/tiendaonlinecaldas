<title>Mi Tablero Vivo</title>
<style>
:root{--bg:#05070d;--cd:#0b1222;--ln:#1a2a4d;--bl:#2f9bff;--cy:#00e5ff;--rd:#ff3355;--gd:#ffc83d;--gr:#2ee6a0;--tx:#e8eefc;--mu:#8b9ac0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

header{position:sticky;top:0;z-index:30;background:rgba(5,7,13,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

#clk{font-family:'Bebas Neue',Impact,sans-serif;font-size:2.1rem;line-height:1;color:var(--cy);text-shadow:0 0 14px rgba(0,229,255,.65);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}

.acts{display:flex;gap:6px;width:100%;flex-wrap:wrap}
.b{border:0;border-radius:12px;padding:9px 14px;font:800 .85rem 'Outfit',sans-serif;color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .12s,box-shadow .2s,filter .2s}
.b:hover{filter:brightness(1.15);transform:translateY(-2px)}.b:active{transform:scale(.96)}
.g{background:linear-gradient(135deg,#1e7bff,#00b8ff);box-shadow:0 0 16px rgba(47,155,255,.4)}

.pg{height:6px;border-radius:9px;background:#121c36;margin:10px 0 4px;overflow:hidden}.pg i{display:block;height:100%;background:var(--c);transition:width .5s}

dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.84rem;margin:10px 0}dt{color:var(--mu)}dd{font-weight:600;word-break:break-word}

.lg{font-size:.8rem;color:var(--mu);padding:4px 0;border-bottom:1px solid #121c36}.lg b{color:var(--cy)}
.cdt{width:56px;text-align:center;background:#070d1a;border:1px solid var(--ln);border-radius:12px;padding:6px 0}.cdt b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:1.7rem;font-weight:400;color:var(--gd);line-height:1}.cdt span{font-size:.68rem;color:var(--mu);text-transform:uppercase}
.cal{max-width:460px}.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:800;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dw{font-size:.7rem;font-weight:800;color:var(--mu)}
.cdy{border:0;background:#0a1226;border-radius:10px;padding:9px 0;font:700 .9rem 'Outfit',sans-serif;cursor:pointer;position:relative;color:var(--tx)}.cdy:hover{background:#15234a}
.cdy.hoy{outline:2px solid var(--gd)}.cdy.sel{background:var(--bl);box-shadow:0 0 14px rgba(47,155,255,.6)}

.empty{color:var(--mu);font-weight:600;font-size:.88rem;text-align:center;padding:18px}
#status{border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.85rem;font-weight:600;background:#1a0f16;border:1px solid var(--rd)}#status.ok{display:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:rgba(5,7,13,.94);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font:800 .72rem 'Outfit',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
nav button span{font-size:1.4rem;transition:transform .2s}nav button.on{color:var(--cy)}nav button.on span{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 0 8px var(--cy))}
#md{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:grid;place-items:end center}
.sh{background:#0b1222;border:1px solid var(--ln);border-radius:22px 22px 0 0;width:min(660px,100%);max-height:92vh;overflow:auto;padding:18px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.fg label{font-size:.76rem;font-weight:800;color:var(--mu)}.fg label.w{grid-column:1/-1}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
#alarm{position:fixed;inset:0;z-index:100;background:rgba(5,7,13,.88);display:grid;place-items:center;padding:18px}
#alarm.siren{animation:fl .7s infinite}@keyframes fl{50%{background:rgba(185,28,48,.92)}}
.box{background:var(--cd);border:1px solid var(--bl);box-shadow:0 0 40px rgba(47,155,255,.5);border-radius:26px;padding:24px 20px;width:min(420px,100%);text-align:center}
#fig{font-size:6rem;line-height:1;animation:jp .6s infinite alternate}@keyframes jp{to{transform:translateY(-14px) rotate(6deg)}}
.box h2{font-size:1.4rem;font-weight:800;margin:8px 0 6px}.box p{font-weight:600;color:var(--mu);margin-bottom:16px}.box .b{width:100%;padding:13px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bl);color:#fff;font-weight:800;padding:10px 18px;border-radius:99px;z-index:120;box-shadow:0 0 20px rgba(47,155,255,.6);animation:up .25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header>
 <div class="brand"><div class="logo">🐶</div><h1>MI TABLERO VIVO</h1></div>
 <div><div id="clk">--:--:--</div><div id="dt"></div></div>
 <div class="acts">
  <button class="b g sm" id="b-perm">🔔 Activar avisos</button>
  <button class="b k sm" id="b-wake">🔆 Pantalla: no</button>
  <button class="b r sm" id="b-test">🚨 Probar alarma</button>
  <button class="b y sm hidden" id="b-install">📲 Instalar</button>
  <button class="b k sm" id="b-bk">💾 Respaldo</button>
 </div>
</header>
<main>
 <div id="status"></div>

 <section class="tab on" id="tab-hoy">
  <div class="cd hero"><div id="gr"></div><div id="bigclk">--:--:--</div><div id="bd"></div></div>
  <div class="stats" id="stats"></div>
  <div class="cd" id="nx"></div>
  <div class="qa"><button class="b g" data-q="t">➕ Tarea</button><button class="b y" data-q="c">📅 Cita</button><button class="b r" data-q="e">🏢 Empresa</button></div>
  <h2 class="t">AGENDA DE HOY</h2><div id="hoy-l"></div>
 </section>

 <section class="tab" id="tab-agenda">
  <div class="cd cal"><div class="cal-h"><button class="mb" id="c-prev" aria-label="Mes anterior">◀</button><span id="c-title"></span><button class="mb" id="c-next" aria-label="Mes siguiente">▶</button></div><div class="cal-g" id="c-grid"></div>
   <div class="cal-h" style="margin:10px 0 0"><span id="c-sel"></span><button class="b y sm" id="c-today">📅 Hoy</button></div></div>
  <div class="bar"><div class="chips" id="filters" style="margin:0"></div><button class="b g" data-q="t">➕ Tarea</button><button class="b y" data-q="c">📅 Cita</button></div>
  <div id="ag-l"></div>
 </section>

 <section class="tab" id="tab-emp">
  <div class="bar"><input id="e-q" placeholder="🔎 Buscar empresa, contacto, nota..."><button class="b r" data-q="e">🏢 Nueva empresa</button></div>

 </section>

 <section class="tab" id="tab-citas">
  <div class="bar"><input id="c-q" placeholder="🔎 Buscar cita, persona, lugar..."><button class="b y" data-q="c">📅 Nueva cita</button></div>
  <div class="chips" id="c-f"></div>
  <div id="c-l"></div>
 </section>
</main>

<nav>
 <button data-go="hoy" class="on"><span>🏠</span>Hoy</button>
 <button data-go="agenda"><span>🗓️</span>Agenda</button>
 <button data-go="emp"><span>🏢</span>Empresas</button>
 <button data-go="citas"><span>📅</span>Citas</button>
</nav>

<div id="md" class="hidden"><div class="sh"><h2 class="t" id="fm-t"></h2><div class="fg" id="fm-b"></div>
 <div style="display:flex;gap:8px"><button class="b g" id="fm-s" style="flex:1">💾 Guardar</button><button class="b k" id="fm-x">Cancelar</button></div></div></div>

<div id="alarm" class="hidden" role="alertdialog" aria-live="assertive"><div class="box">
 <div id="fig">🐶</div><h2 id="a-t"></h2><p id="a-s"></p>
 <button class="b g" id="a-done">✅ ¡Listo! Marcar como hecha</button>
 <button class="b y" id="a-snz">⏰ Posponer 5 minutos</button>
 <button class="b r" id="a-stop">🔕 Detener alarma</button></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],p2=n=>String(n).padStart(2,'0');
const K='tablero_vivo_v2',OLD='tablero_vivo_pwa_v1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const f12=hm=>{if(!/^\d\d:\d\d$/.test(hm||''))return hm||'';const h=+hm.slice(0,2);return (h%12||12)+':'+hm.slice(3)+' '+(h<12?'a. m.':'p. m.')};
const CATS={papas:'🧡 Papás',medica:'🩺 Médica',urgente:'🚨 Urgente',trabajo:'💼 Trabajo',hogar:'🏠 Hogar'};
const CHARS=['🐶 Toby Perrito','👩‍⚕️ Dra. Mía','🚨 Sirena Roja','🤖 Max Robot','🦉 Búho Sabio'];
const COL=['#2f9bff','#ff3355','#ffc83d','#2ee6a0','#b06bff','#ff8a3d'];
const ESTE=['Activo','Prospecto','Pausado','Cerrado'],ESTC=['Pendiente','Confirmada','Realizada','Cancelada'];
const AVISO=[['0','A la hora'],['10','10 min antes'],['15','15 min antes'],['30','30 min antes'],['60','1 hora antes'],['1440','1 día antes']];
const FS={
 t:[['title','¿Qué debes hacer?','text',0,1],['date','Fecha','date'],['time','Hora','time'],['repeat','Repetir','sel',[['daily','Todos los días'],['once','Solo esa fecha']]],['cat','Categoría','sel',Object.entries(CATS)],['alert','Alerta','sel',CHARS]],
 e:[['nombre','Nombre de la empresa','text',0,1],['sector','Sector / tipo de negocio','text'],['estado','Estado','sel',ESTE],['contacto','Persona de contacto','text'],['wa','WhatsApp','tel'],['correo','Correo','email'],['fb','Facebook','text'],['ig','Instagram','text'],['tt','TikTok','text'],['plan','Servicio / plan','text'],['valor','Valor mensual ($)','number'],['pago','Próximo pago','date'],['meta','Objetivo / meta','text',0,1],['pend','Pendientes (uno por línea)','area',0,4],['extra','Datos extra (uno por línea, ej: Horario: 8 a 6)','area',0,4],['notas','Notas','area',0,4]],
 c:[['titulo','Motivo de la cita','text',0,1],['emp','Empresa','sel',()=>[['','— Otra / ninguna —'],...D.emp.map(x=>[x.id,x.nombre])]],['persona','Persona','text'],['tel','Teléfono / WhatsApp','tel'],['tipo','Tipo','sel',['Asesoría','Reunión','Médica','Venta','Personal','Otra']],['lugar','Lugar o enlace','text'],['fecha','Fecha','date'],['hora','Hora','time'],['aviso','Avisar','sel',AVISO],['estado','Estado','sel',ESTC],['alert','Alerta','sel',CHARS],['notas','Notas (todo lo que tengas)','area',0,4]]};
const DEF={t:()=>({title:'',date:sel,time:'09:00',repeat:'daily',cat:'trabajo',alert:CHARS[0],done:{}}),e:()=>({estado:'Activo',pend:[],log:[]}),c:()=>({fecha:sel,hora:'10:00',tipo:'Asesoría',aviso:'15',estado:'Pendiente',alert:CHARS[1]})};
let D={tasks:[],emp:[],citas:[]},sel='',view=new Date(),tab='hoy',fcat='all',efil='Todas',cfil='Todas',openE=new Set(),fid=null;
let queue=[],cur=null,ctx=null,loop=null,stopT=null,wake=null,wakeOn=false,flashT=null,installEv=null;

function load(){
 try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}
 if(!D){let old=null;try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){}
  D={tasks:Array.isArray(old)?old:[
   {id:'t1',title:'Acompañar a mis papás al control médico',time:'09:30',cat:'papas',alert:CHARS[0],repeat:'daily'},
   {id:'t2',title:'Tomar medicamentos y revisar tensión',time:'14:00',cat:'medica',alert:CHARS[1],repeat:'daily'},
   {id:'t3',title:'Revisar pendientes importantes de mañana',time:'19:30',cat:'urgente',alert:CHARS[2],repeat:'daily'}],
   emp:['Melao Sabor y Café','La Dorada Tolimense','Dondecheche','Camilart'].map((n,i)=>({id:'e'+i,nombre:n,estado:'Activo',pend:[],log:[]})),citas:[]}}
 fix();sel=today();view=new Date();
}
function fix(){
 D.tasks=D.tasks||[];D.emp=D.emp||[];D.citas=D.citas||[];
 D.tasks.forEach(t=>{if(!t.date)t.date=today();if(!t.done||typeof t.done!=='object')t.done={};if(t.doneDate){t.done[t.doneDate]=true;delete t.doneDate}if(!t.repeat)t.repeat='daily'});
 D.emp.forEach((e,i)=>{e.pend=e.pend||[];e.log=e.log||[];e.estado=e.estado||'Activo';e.color=e.color||COL[i%COL.length]});
}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const onDay=(t,d)=>t.repeat==='once'?t.date===d:d>=(t.date||'');
const isDone=(t,d=today())=>!!(t.done&&t.done[d]);
const setDone=(t,d,v)=>{if(v)t.done[d]=true;else delete t.done[d]};
const cOff=c=>c.estado==='Realizada'||c.estado==='Cancelada';
const wa=(n,m)=>{let d=String(n||'').replace(/\D/g,'');if(d.length===10)d='57'+d;return 'https://wa.me/'+d+(m?'?text='+encodeURIComponent(m):'')};
const money=v=>isNaN(+v)?esc(v):'$'+(+v).toLocaleString('es-CO');
const empName=id=>(D.emp.find(e=>e.id===id)||{}).nombre||'';
function toast(m){let t=$('#toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}

/* ---------- Pestañas ---------- */
function go(t){tab=t;$$('.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+t));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===t));scrollTo({top:0,behavior:'smooth'});render()}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));

/* ---------- Pantallas ---------- */
function dayItems(d){
 const a=[];D.tasks.filter(t=>(fcat==='all'||t.cat===fcat)&&onDay(t,d)).forEach(t=>a.push({k:'t',o:t,time:t.time}));
 D.citas.filter(c=>c.fecha===d).forEach(c=>a.push({k:'c',o:c,time:c.hora||'00:00'}));
 return a.sort((x,y)=>x.time.localeCompare(y.time));
}
function row(i,d){
 const o=i.o,c=i.k==='c',dn=c?cOff(o)&&o.estado==='Realizada':isDone(o,d);
 const sub=c?[o.tipo,o.persona||empName(o.emp),o.lugar].filter(Boolean).map(esc).join(' • '):`${CATS[o.cat]||'📌'} • ${esc(o.alert)} • ${o.repeat==='once'?'Solo esta fecha':'Todos los días'}`;
 return `<div class="row${c?' c':''}${dn?' done':''}"><div class="rh">${f12(i.time)}</div><div class="rm"><div class="rt">${c?'📅 ':''}${esc(c?o.titulo:o.title)}</div><div class="rs">${sub}</div></div>
 <button class="mb" data-a="done" data-k="${i.k}" data-id="${o.id}" data-d="${d}" title="Completar">${dn?'↩️':'✅'}</button><button class="mb" data-a="edit" data-k="${i.k}" data-id="${o.id}" title="Editar">✏️</button><button class="mb" data-a="del" data-k="${i.k}" data-id="${o.id}" title="Eliminar">🗑️</button></div>`;
}
function countUp(el,n){if(el.dataset.v==n)return;el.dataset.v=n;let i=0;const s=Math.max(1,Math.ceil(n/14)),t=setInterval(()=>{i=Math.min(n,i+s);el.textContent=i;if(i>=n)clearInterval(t)},35)}
function render(){
 const td=today(),it=dayItems(td);
 $('#hoy-l').innerHTML=it.length?it.map(i=>row(i,td)).join(''):'<div class="empty">Nada programado hoy. ¡Agrega una tarea o una cita!</div>';
 const pend=D.emp.reduce((n,e)=>n+e.pend.filter(p=>!p.d).length,0);
 $('#stats').innerHTML=[['t','agenda','Tareas hoy',D.tasks.filter(t=>onDay(t,td)&&!isDone(t)).length],['c','citas','Citas hoy',D.citas.filter(c=>c.fecha===td&&!cOff(c)).length],['e','emp','Empresas activas',D.emp.filter(e=>e.estado==='Activo').length],['p','emp','Pendientes empresas',pend]].map(s=>`<div class="st" data-st="${s[1]}"><b id="s-${s[0]}" data-v="">0</b><span>${s[2]}</span></div>`).join('');
 [['t',0],['c',1],['e',2],['p',3]].forEach(([k,i])=>countUp($('#s-'+k),[D.tasks.filter(t=>onDay(t,td)&&!isDone(t)).length,D.citas.filter(c=>c.fecha===td&&!cOff(c)).length,D.emp.filter(e=>e.estado==='Activo').length,pend][i]));
 renderCal();
 const ai=dayItems(sel);$('#ag-l').innerHTML=ai.length?ai.map(i=>row(i,sel)).join(''):'<div class="empty">Sin actividades este día</div>';
 $('#filters').innerHTML=[['all','🌈 Todas'],...Object.entries(CATS)].map(([k,v])=>`<button class="chip${fcat===k?' on':''}" data-f="${k}">${v}</button>`).join('');
 renderEmp();renderCitas();tick();
}

 const y=view.getFullYear(),m=view.getMonth(),td=today();

 const st=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let h=['L','M','M','J','V','S','D'].map(d=>`<div class="dw">${d}</div>`).join('')+'<div></div>'.repeat(st);
 for(let d=1;d<=n;d++){const ds=y+'-'+p2(m+1)+'-'+p2(d),has=D.tasks.some(t=>t.repeat==='once'&&t.date===ds)||D.citas.some(c=>c.fecha===ds);
  h+=`<button class="cdy${ds===td?' hoy':''}${ds===sel?' sel':''}" data-d="${ds}">${d}${has?'<i></i>':''}</button>`}
 $('#c-grid').innerHTML=h;

/* ---------- Reloj y alarmas ---------- */
function occ(){
 const td=today(),out=[];
 D.tasks.forEach(t=>{if(!isDone(t)&&onDay(t,td))out.push({o:t,id:t.id,title:t.title,alert:t.alert,time:t.time,when:new Date(td+'T'+t.time).getTime(),key:td+' '+t.time})});
 D.citas.forEach(c=>{if(cOff(c)||!c.fecha||!c.hora)return;out.push({o:c,id:c.id,title:'📅 '+c.titulo+(c.persona?' — '+c.persona:''),alert:c.alert||CHARS[1],time:c.hora,when:new Date(c.fecha+'T'+c.hora).getTime()-(+c.aviso||0)*6e4,key:c.fecha+' '+c.hora+' '+c.aviso})});
 return out;
}
function nextItem(){
 const n=Date.now(),td=today();let b=null;const c=(title,dt,k)=>{if(dt>n&&(!b||dt<b.dt))b={title,dt,k}};
 D.tasks.forEach(t=>{if(!isDone(t)&&onDay(t,td))c(t.title,new Date(td+'T'+t.time).getTime(),'🔔')});
 D.citas.forEach(x=>{if(!cOff(x)&&x.fecha&&x.hora)c(x.titulo+(x.persona?' — '+x.persona:''),new Date(x.fecha+'T'+x.hora).getTime(),'📅')});
 return b;
}
function tick(){
 const n=new Date(),h=n.getHours(),ap=h<12?'a. m.':'p. m.',t=`${h%12||12}:${p2(n.getMinutes())}:${p2(n.getSeconds())}`;
 $('#clk').innerHTML=t+`<small>${ap}</small>`;$('#bigclk').innerHTML=t+`<small>${ap}</small>`;
 const ds=n.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#dt').textContent=ds;$('#bd').textContent=ds;
 $('#gr').textContent=(h<12?'🌅 ¡Buenos días!':h<19?'☀️ ¡Buenas tardes!':'🌙 ¡Buenas noches!');
 const x=nextItem();
 if(x){const m=Math.max(0,Math.floor((x.dt-n)/6e4)),d=Math.floor(m/1440),hh=Math.floor(m%1440/60);
  $('#nx').innerHTML=`<div><div class="rs">SIGUIENTE</div><div class="rt" style="font-size:1.15rem">${x.k} ${esc(x.title)}</div><div class="rs">${new Date(x.dt).toLocaleString('es',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div></div><div class="cnt">en ${d?d+' d ':''}${hh?hh+' h ':''}${m%60} min</div>`}
 else $('#nx').innerHTML='<div class="rt">🎉 Nada pendiente por ahora</div>';
 const now=Date.now();
 occ().forEach(x=>{const o=x.o;
  if(o.snooze){if(now>=o.snooze){o.snooze=0;save();fire(x,0)}return}
  const late=Math.floor((now-x.when)/6e4);
  if(late>=0&&late<=30&&o.fired!==x.key){o.fired=x.key;save();fire(x,late)}});
}
function fire(x,late,demo){
 if(cur&&cur.x.id===x.id||queue.some(q=>q.x.id===x.id))return;
 queue.push({x,late,demo});notify(x);if(!cur)next();
}
function next(){
 if(!queue.length)return;cur=queue.shift();const x=cur.x,siren=x.alert.includes('Sirena');
 $('#fig').textContent=x.alert.split(' ')[0];$('#a-t').textContent=x.title;
 $('#a-s').textContent=cur.late>1?`⏰ Estaba programada a las ${f12(x.time)} (hace ${cur.late} min)`:`⏰ ${f12(x.time)} • ${x.alert}`;
 $('#alarm').classList.toggle('siren',siren);$('#alarm').classList.remove('hidden');
 $('#a-done').classList.toggle('hidden',!!cur.demo);$('#a-snz').classList.toggle('hidden',!!cur.demo);
 sound(siren);if(navigator.vibrate)navigator.vibrate([400,200,400,200,800]);flashTitle('🔔 '+x.title);
 try{speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance('Recordatorio: '+x.title.replace('📅',''));u.lang='es';speechSynthesis.speak(u)},1200)}catch(e){}
}
function closeAlarm(){
 stopSound();clearInterval(flashT);document.title='Mi Tablero Vivo';try{speechSynthesis.cancel()}catch(e){}
 if(cur&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.getNotifications({tag:cur.x.id}).then(l=>l.forEach(n=>n.close()))).catch(()=>{});
 $('#alarm').classList.add('hidden');cur=null;next();
}
function act(id,a){
 const t=D.tasks.find(x=>x.id===id),c=D.citas.find(x=>x.id===id),o=t||c;if(!o)return;
 if(a==='done'){if(t)setDone(t,today(),true);else c.estado='Realizada'}
 if(a==='snooze')o.snooze=Date.now()+5*60000;
 save();render();if(cur&&cur.x.id===id)closeAlarm();
}
$('#a-done').onclick=()=>act(cur.x.id,'done');$('#a-snz').onclick=()=>act(cur.x.id,'snooze');$('#a-stop').onclick=closeAlarm;

function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function sound(siren){
 stopSound();unlock();if(!ctx)return;
 const pulse=()=>{const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;o.connect(g);g.connect(ctx.destination);
  if(siren){o.type='sawtooth';o.frequency.setValueAtTime(620,n);o.frequency.linearRampToValueAtTime(980,n+.35);o.frequency.linearRampToValueAtTime(620,n+.7);g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.01,n+.72);o.start(n);o.stop(n+.75)}
  else{o.type='triangle';[523.25,659.25,783.99].forEach((f,i)=>o.frequency.setValueAtTime(f,n+i*.15));g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.01,n+.55);o.start(n);o.stop(n+.58)}};
 pulse();loop=setInterval(pulse,950);stopT=setTimeout(stopSound,120000);
}
function stopSound(){clearInterval(loop);clearTimeout(stopT);loop=null}
function flashTitle(m){clearInterval(flashT);let x=0;flashT=setInterval(()=>{document.title=(x++%2)?'Mi Tablero Vivo':m},900)}
function notify(x){
 if(!('Notification' in window)||Notification.permission!=='granted'||!navigator.serviceWorker)return;
 navigator.serviceWorker.ready.then(r=>r.showNotification(x.title,{body:`⏰ ${f12(x.time)} • ${x.alert}`,tag:x.id,renotify:true,requireInteraction:true,icon:'icon-192.png',badge:'icon-192.png',vibrate:[400,200,400,200,800],data:{id:x.id},
  actions:[{action:'done',title:'✅ Hecha'},{action:'snooze',title:'⏰ +5 min'}]})).catch(()=>{});
}
function status(){
 const s=$('#status'),perm='Notification' in window?Notification.permission:'unsupported';
 $('#b-perm').classList.toggle('hidden',perm==='granted');
 if(perm==='granted'){s.className='ok'}
 else if(perm==='denied'){s.className='';s.textContent='⛔ Los avisos están bloqueados. Actívalos en los permisos del sitio (candado junto a la dirección o Ajustes del celular).'}
 else{s.className='';s.textContent='🔔 Pulsa “Activar avisos” para recibir alertas aunque la app esté en segundo plano. Mantén la app abierta para que suene a la hora exacta.'}
}
$('#b-perm').onclick=async()=>{unlock();if('Notification' in window)await Notification.requestPermission();status()};
async function setWake(on){
 try{if(on){wake=await navigator.wakeLock.request('screen');wake.onrelease=()=>{wake=null}}else if(wake){await wake.release();wake=null}wakeOn=on}
 catch(e){wakeOn=false;alert('Este dispositivo no permite mantener la pantalla encendida.')}
 $('#b-wake').textContent='🔆 Pantalla: '+(wakeOn?'sí':'no');
}
$('#b-wake').onclick=()=>setWake(!wakeOn);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(wakeOn&&!wake)setWake(true);tick()}});
$('#b-test').onclick=()=>{unlock();fire({id:'demo',title:'¡ALERTA DE SIRENA ACTIVA!',time:'ahora',alert:'🚨 Sirena Roja'},0,true)};
$('#b-bk').onclick=async()=>{
 const j=JSON.stringify(D);
 if(confirm('Aceptar = COPIAR respaldo (tareas, empresas y citas) al portapapeles.\nCancelar = PEGAR un respaldo para restaurarlo.')){
  try{await navigator.clipboard.writeText(j);alert('Respaldo copiado. Pégalo en tu otro dispositivo con "Respaldo → Cancelar".')}catch(e){prompt('Copia este texto:',j)}
 }else{
  const s=prompt('Pega aquí el respaldo:');if(!s)return;
  try{let a=JSON.parse(s);if(Array.isArray(a))a={tasks:a,emp:D.emp,citas:D.citas};if(!a||typeof a!=='object')throw 0;D=a;fix();save();render();toast('✅ Respaldo restaurado')}catch(e){alert('El respaldo no es válido.')}
 }
};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;$('#b-install').classList.remove('hidden')});
$('#b-install').onclick=async()=>{if(!installEv)return;installEv.prompt();await installEv.userChoice;installEv=null;$('#b-install').classList.add('hidden')};
window.addEventListener('appinstalled',()=>$('#b-install').classList.add('hidden'));
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 navigator.serviceWorker.register('sw.js').catch(()=>{});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='act')act(e.data.id,e.data.action)});
}
load();render();status();setInterval(tick,1000);
